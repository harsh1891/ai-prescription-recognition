services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prescriptions
      POSTGRES_USER: prescription_user
      POSTGRES_PASSWORD: prescription_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://prescription_user:prescription_pass@postgres:5432/prescriptions
      VISION_PROVIDER: mock
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./datasets:/app/datasets:ro

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

